<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#075c70"><title>COC Twi Hymnal</title><link rel="manifest" href="manifest.json"><style>
:root{--teal:#075c70;--teal2:#087f8c;--bg:#f3f7f8;--card:#fff;--text:#172b33;--muted:#647780;--line:#dce7e9;--gold:#f3c969}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}header{background:linear-gradient(135deg,var(--teal),var(--teal2));color:white;padding:22px 18px 18px;border-radius:0 0 24px 24px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:15px;background:#ffffff22;display:grid;place-items:center;font-size:27px;border:1px solid #ffffff55}h1{font-size:22px;line-height:1.15;margin:0}.subtitle{opacity:.85;font-size:13px;margin-top:4px}.wrap{max-width:780px;margin:auto;padding:16px}.searchrow{display:flex;gap:8px;margin-top:18px}input,button{font:inherit}#search{flex:1;min-width:0;border:0;border-radius:13px;padding:13px 14px;background:white;color:#172b33;outline-offset:3px}button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;font-weight:650}.searchrow button{background:var(--gold);color:#27343a}.tabs,.langtabs{display:flex;gap:8px;margin:16px 0;overflow:auto}.tab,.lang{background:#e2edef;color:var(--teal);white-space:nowrap}.tab.active,.lang.active{background:var(--teal);color:white}.status{font-size:13px;color:var(--muted);margin:8px 2px 12px}.list{display:grid;gap:9px}.hymn{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px;text-align:left;width:100%;color:var(--text)}.num{background:#e3f4f5;color:var(--teal);min-width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-weight:800}.hymntext{flex:1;min-width:0}.hymntitle{font-weight:750;overflow-wrap:anywhere}.hint{font-size:13px;color:var(--muted)}.heart{font-size:22px;color:var(--teal);padding:5px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:17px;margin-top:14px}.hidden{display:none!important}.back{background:#e2edef;color:var(--teal);margin-bottom:12px}.detailhead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.detailhead h2{margin:0;font-size:21px;line-height:1.3}.detailmeta{font-size:13px;color:var(--muted);margin-top:5px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.secondary{background:#e5eff0;color:var(--teal)}.lyrics{white-space:pre-wrap;overflow-wrap:anywhere;font-size:19px;line-height:1.9;text-align:center;padding:10px 2px}.chorus-title{font-weight:800;text-align:center;color:var(--teal);margin-top:20px}.note{font-size:12px;color:var(--muted);background:#f4f8f8;padding:11px;border-radius:10px;margin-top:16px}footer{text-align:center;color:var(--muted);font-size:12px;padding:25px 10px}</style></head><body>
<header><div class="brand"><div class="logo">♫</div><div><h1>COC Twi Hymnal</h1><div class="subtitle">Church of Christ · Sing unto the Lord</div></div></div><form class="searchrow" id="searchForm"><input id="search" placeholder="Search number, title or lyrics…" aria-label="Search hymns"><button type="submit">Search</button></form></header>
<main class="wrap"><div class="tabs"><button class="tab active" data-view="all">All hymns</button><button class="tab" data-view="favorites">♥ Favorites</button></div><div id="status" class="status">4 hymns in this starter library</div><section id="list" class="list"></section><section id="detail" class="panel hidden"><button id="back" class="back">← Back to hymns</button><div class="detailhead"><div><h2 id="detailTitle"></h2><div id="detailMeta" class="detailmeta"></div></div><button id="detailHeart" class="secondary">♡ Favorite</button></div><div class="langtabs"><button class="lang active" data-lang="twi">Twi Version</button><button class="lang" data-lang="english">English Version</button></div><div class="actions"><button id="smaller" class="secondary">A− Smaller text</button><button id="larger" class="secondary">A+ Larger text</button><button id="share" class="secondary">Share</button></div><div id="lyrics" class="lyrics"></div><div id="chorusWrap" class="hidden"><div class="chorus-title">Nnyesoɔ</div><div id="chorus" class="lyrics"></div></div><div class="note">This starter library currently contains Hymns 1–4. Add more hymns only when their lyrics are authorized for reuse.</div></section><div id="empty" class="panel hidden">No hymns found. Try another search.</div><footer>COC Twi Hymnal · Starter library</footer></main>
<script>const hymns=[{"id": 1, "twiTitle": "NAAWOTWE DA A EDI KAN NO", "englishTitle": "UPON THE FIRST DAY OF THE WEEK", "twi": "Naawotwe da a edi kan no m\nYe'Ayenkwa sore fi nna mu\nOwui, wosiee no, w'asore\nSe onni hene na onnye yen nkwa.\n\nNaawotwe da a edi kan no m\nAsuafo hyiae bubu abodoo\nWonom nkae kuruwa ano\nDe kae dee okyii ne mogya mmae\n\nNaawotwe da a edi kan no m\nMoma yen nsiesie yen ho sie\nNa yenfa dee ahene mu hene\nDe adom yen no mu bi mere no.\n\nSaa day i mu na Yohane\nHunu Kristo na otee ne nne\nYen so yesom wo honhom mu\nDe mpae ne nnowm ma ye anigye.", "english": "Upon the first day of the week,\nOur Savior came forth from the grave,\nHe died, was buried, then arose,\nTo reign, to triumph, and to save!\n\nUpon the first day of the week,\nDisciples met to break the bread,\nAnd drink the cup in memory of Him\nWhose blood for us was shed\n\nUpon the first day of the week,\nLet each of us lay by in store,\nAs blessed and prospered by the Lord,\nThe King of Kings whom we adore\n\nUpon this day \"beloved\" John,\nsaw Christ, and heard His trumpet voice\nWe, too, in spirit worship Him,\nWith pray'r and song our hearts rejoice.", "chorus": "Se binom bepow Awurade\nYen dee ye pe wo nokware no\nWo ka yen ho kyekye yen were\nNaawotwe da a edi kan no m"}, {"id": 2, "twiTitle": "ME KRA AWIA", "englishTitle": "SUN OF MY SOUL", "twi": "Me kra awia m'Agyenkwa pa\nWo ben me a ade nsa me da\nMma sum bi mfi asase yi so\nNhinta wo mfi w'akoa ani so.\n\nSe enna de ne bosuo no\nKa mani brefoo yi gu soo\nMa mendwene de a ebeye\nSe mehome m'Agyenkwa bom daa.\n\nWo ne me ntena adekyee mu\nWonni me nkyen a mentumi ntena ase\nAde resa a wo ne me ntena\nWo ka me ho a mensuro wuo.\n\nSe yenyane a behyira yen\nAnsa na ye'afa yen akwan so\nKosi se odo kese no\nDe yebepue osoro nohoaa", "english": "Sun of my soul, thou Saviour dear,\nIt is not night if thou be near;\nO may no earth-born cloud arise\nTo hide thee from thy servant's eyes\n\nWhen the soft dews of kindly sleep\nMy wearied eye lids gently steep,\nBe my last tho't, how sweet to rest,\nForever on my Saviour's breast.\n\nAbide with me from morn till eve,\nFor without thee I cannot live;\nAbide with me when night is nigh,\nFor without thee I dare not die.\n\nCome near and bless us when we wake,\nEre thro' the world our way we take;\nAbide with me when night is nigh,\nFor without thee I dare not die.", "chorus": ""}, {"id": 3, "twiTitle": "HYIRA NKA HOMA", "englishTitle": "BLEST BE THE TIE", "twi": "Hyira nka homa a eka\nYe akoma bom Kristo dom\nAyonkofa wo adwenen koro m\nTe se osoro de no.\n\nYe hwiee yen mpae denden\nGu Agya ahenwa no anim\nYen suro, yebotae ye koro\nYen awerekyekye ni ye hia.\n\nYe kye amanee koro no\nYe soa yen adesoa koro no\nNa ye taa nya ayamhyehye\nMa yen nuanom nyinaa.\n\nSe ye mu hwete a\nYedi yea wo yen mu pii\nNanso ye bom' wo akoma mu\nNa yenim se yebehvia bio.", "english": "Blest be the tie that binds\nOur hearts in Christian love\nThe fellowship of kindred minds\nIs like to that above.\n\nBefore our Father's throne\nWe pour our ardent prayers;\nOur fears, our hopes, our aims are one\nOur comforts and our cares\n\nWe share our mutual woes,\nOur mutual burdens bear;\nAnd often for each other flows\nThe sympathizing tear.\n\nWhen we asunder part,\nIt gives us inward pain;\nBut we shall still be joined in heart,\nAnd hope to meet again.", "chorus": ""}, {"id": 4, "twiTitle": "YERETU SA AKO ZION", "englishTitle": "WE'RE MARCHING TO ZION", "twi": "Mo a modo Awurade\nMommra, mo ma mo ani ngye\nMonso mu ntonnwom a eye de\nMontwa ahennwa n'ho nhyia.\n\nWon a wonnim Nyame\nWorento nnwom yi bi\nNa osoro hene no mma no dee\nNa osoro hene no mma no dee\nWobeka won anigye akyere aman\nWobeka akyere aman.\n\nZion kokoo kronkron no\nEso nnipa mpempem\nSe yeduru so asase so\nSe yeduru soro asase so\nAnaa sikea morono no so\nSika norono no so.\n\nMomma ndwom no nko so\nNa nisuo nyinaa new\nYenam Emmanuel sase so\nYenam Emmanuel sase so\nAko bea fefe bi wo soro\nBea fefe bi wo soro.", "english": "Come, we that love the Lord,\nAnd let our joys be known,\nJoin in a song with sweet accord,\nJoin in a song with sweet accord,\nAnd thus surround the throne\nAnd thus surround the throne.\n\nLet those refuse to sing\nWho never knew our God;\nBut children of the heavenly King,\nBut children of the Heavenly King,\nMay speak their joys abroad,\nMay speak their joys abroad.\n\nThe hill of Zion yields\nA thousand sacred sweets,\nBefore we reach the heavenly fields,\nBefore we reach the heav'nly fields\nOr walk the golden streets,\nOr walk the golden streets.\n\nThen let our songs abound,\nAnd ev'ry tear be dry;\nWe're marching thru Immanuel's ground,\nWe're marching thru Immanuel's ground,\nTo fairer worlds on high, to fairer worlds on high.", "chorus": "Zion fefe no\nYeretu sa ado Zion\nNyame kuro fefe."}];const $=id=>document.getElementById(id);let view='all',query='',current=null,lang='twi',fontSize=19;function getFav(){try{return JSON.parse(localStorage.getItem('coc-twi-favorites')||'[]')}catch(e){return []}}function setFav(a){try{localStorage.setItem('coc-twi-favorites',JSON.stringify(a))}catch(e){}}function allText(h){return [h.id,h.twiTitle,h.englishTitle,h.twi,h.english,h.chorus].join(' ').toLowerCase()}function render(){let fav=getFav();let filtered=hymns.filter(h=>(view!=='favorites'||fav.includes(h.id))&&allText(h).includes(query.toLowerCase()));$('list').innerHTML='';filtered.forEach(h=>{let b=document.createElement('button');b.className='hymn';b.type='button';let n=document.createElement('span');n.className='num';n.textContent=h.id;let t=document.createElement('span');t.className='hymntext';let title=document.createElement('span');title.className='hymntitle';title.textContent=h.twiTitle;let sub=document.createElement('div');sub.className='hint';sub.textContent=h.englishTitle+' · Hymn '+h.id;t.append(title,sub);let heart=document.createElement('span');heart.className='heart';heart.textContent=fav.includes(h.id)?'♥':'♡';b.append(n,t,heart);b.addEventListener('click',()=>openHymn(h.id));$('list').append(b)});$('status').textContent=filtered.length+' hymn'+(filtered.length===1?'':'s')+' shown · '+hymns.length+' available';$('empty').classList.toggle('hidden',filtered.length>0);$('list').classList.toggle('hidden',!!current)}function openHymn(id){current=hymns.find(h=>h.id===id);if(!current)return;lang='twi';document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));$('detailTitle').textContent=current.twiTitle;$('detailMeta').textContent='Hymn '+current.id+' · '+current.englishTitle;showLyrics();updateHeart();$('detail').classList.remove('hidden');$('list').classList.add('hidden');$('empty').classList.add('hidden');$('status').classList.add('hidden')}function showLyrics(){if(!current)return;$('lyrics').textContent=current[lang];$('lyrics').style.fontSize=fontSize+'px';$('chorusWrap').classList.toggle('hidden',lang!=='twi'||!current.chorus);$('chorus').textContent=current.chorus||'';$('chorus').style.fontSize=fontSize+'px'}function updateHeart(){let yes=getFav().includes(current.id);$('detailHeart').textContent=yes?'♥ Saved':'♡ Favorite'}function back(){current=null;$('detail').classList.add('hidden');$('status').classList.remove('hidden');render()}$('searchForm').addEventListener('submit',e=>{e.preventDefault();query=$('search').value.trim();back()});$('search').addEventListener('input',()=>{query=$('search').value.trim();render()});document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));back()}));document.querySelectorAll('.lang').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;document.querySelectorAll('.lang').forEach(x=>x.classList.toggle('active',x===b));showLyrics()}));$('back').addEventListener('click',back);$('detailHeart').addEventListener('click',()=>{let f=getFav(),i=f.indexOf(current.id);if(i>=0)f.splice(i,1);else f.push(current.id);setFav(f);updateHeart();render()});$('larger').addEventListener('click',()=>{fontSize=Math.min(34,fontSize+2);showLyrics()});$('smaller').addEventListener('click',()=>{fontSize=Math.max(14,fontSize-2);showLyrics()});$('share').addEventListener('click',async()=>{let text='Hymn '+current.id+': '+(lang==='twi'?current.twiTitle:current.englishTitle)+'\n\n'+current[lang]+(lang==='twi'&&current.chorus?'\n\nNnyesoɔ:\n'+current.chorus:'');try{if(navigator.share)await navigator.share({title:current.twiTitle,text});else if(navigator.clipboard){await navigator.clipboard.writeText(text);alert('Hymn text copied.')}else alert(text)}catch(e){}});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});render();</script></body></html>
