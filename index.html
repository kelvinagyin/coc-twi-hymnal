al);margin-bottom:12px}.detailhead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.detailhead h2{margin:0;font-size:21px;line-height:1.3}.detailmeta{font-size:13px;color:var(--muted);margin-top:5px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.secondary{background:#e5eff0;color:var(--teal)}.lyrics{white-space:pre-wrap;overflow-wrap:anywhere;font-size:19px;line-height:1.9;text-align:center;padding:10px 2px}.chorus-title{font-weight:800;text-align:center;color:var(--teal);margin-top:20px}.note{font-size:12px;color:var(--muted);background:#f4f8f8;padding:11px;border-radius:10px;margin-top:16px}footer{text-align:center;color:var(--muted);font-size:12px;padding:25px 10px}</style></head><body>

<script>const hymns=[{"id":1,"twiTitle":"NAAWOTWE DA A EDI KAN NO","englishTitle":"UPON THE FIRST DAY OF THE WEEK","twi":"Naawotwe da a edi kan no m\nYe'Ayenkwa sore fi nna mu\nOwui, wosiee no, w'asore\nSe onni hene na onnye yen nkwa.\n\nNaawotwe da a edi kan no m\nAsuafo hyiae bubu abodoo\nWonom nkae kuruwa ano\nDe kae dee okyii ne mogya mmae\n\nNaawotwe da a edi kan no m\nMoma yen nsiesie yen ho sie\nNa yenfa dee ahene mu hene\nDe adom yen no mu bi mere no.\n\nSaa day i mu na Yohane\nHunu Kristo na otee ne nne\nYen so yesom wo honhom mu\nDe mpae ne nnowm ma ye anigye.","english":"Upon the first day of the week,\nOur Savior came forth from the grave,\nHe died, was buried, then arose,\nTo reign, to triumph, and to save!\n\nUpon the first day of the week,\nDisciples met to break the bread,\nAnd drink the cup in memory of Him\nWhose blood for us was shed\n\nUpon the first day of the week,\nLet each of us lay by in store,\nAs blessed and prospered by the Lord,\nThe King of Kings whom we adore\n\nUpon this day \"beloved\" John,\nsaw Christ, and heard His trumpet voice\nWe, too, in spirit worship Him,\nWith pray'r and song our hearts rejoice.","chorus":"Se binom bepow Awurade\nYen dee ye pe wo nokware no\nWo ka yen ho kyekye yen were\nNaawotwe da a edi kan no m"},{"id":2,"twiTitle":"ME KRA AWIA","englishTitle":"SUN OF MY SOUL","twi":"Me kra awia m'Agyenkwa pa\nWo ben me a ade nsa me da\nMma sum bi mfi asase yi so\nNhinta wo mfi w'akoa ani so.\n\nSe enna de ne bosuo no\nKa mani brefoo yi gu soo\nMa mendwene de a ebeye\nSe mehome m'Agyenkwa bom daa.\n\nWo ne me ntena adekyee mu\nWonni me nkyen a mentumi ntena ase\nAde resa a wo ne me ntena\nWo ka me ho a mensuro wuo.\n\nSe yenyane a behyira yen\nAnsa na ye'afa yen akwan so\nKosi se odo kese no\nDe yebepue osoro nohoaa","english":"Sun of my soul, thou Saviour dear,\nIt is not night if thou be near;\nO may no earth-born cloud arise\nTo hide thee from thy servant's eyes\n\nWhen the soft dews of kindly sleep\nMy wearied eye lids gently steep,\nBe my last tho't, how sweet to rest,\nForever on my Saviour's breast.\n\nAbide with me from morn till eve,\nFor without thee I cannot live;\nAbide with me when night is nigh,\nFor without thee I dare not die.\n\nCome near and bless us when we wake,\nEre thro' the world our way we take;\nAbide with me when night is nigh,\nFor without thee I dare not die.","chorus":""},{"id":3,"twiTitle":"HYIRA NKA HOMA","englishTitle":"BLEST BE THE TIE","twi":"Hyira nka homa a eka\nYe akoma bom Kristo dom\nAyonkofa wo adwenen koro m\nTe se osoro de no.\n\nYe hwiee yen mpae denden\nGu Agya ahenwa no anim\nYen suro, yebotae ye koro\nYen awerekyekye ni ye hia.\n\nYe kye amanee koro no\nYe soa yen adesoa koro no\nNa ye taa nya ayamhyehye\nMa yen nuanom nyinaa.\n\nSe ye mu hwete a\nYedi yea wo yen mu pii\nNanso ye bom' wo akoma mu\nNa yenim se yebehvia bio.","english":"Blest be the tie that binds\nOur hearts in Christian love\nThe fellowship of kindred minds\nIs like to that above.\n\nBefore our Father's throne\nWe pour our ardent prayers;\nOur fears, our hopes, our aims are one\nOur comforts and our cares\n\nWe share our mutual woes,\nOur mutual burdens bear;\nAnd often for each other flows\nThe sympathizing tear.\n\nWhen we asunder part,\nIt gives us inward pain;\nBut we shall still be joined in heart,\nAnd hope to meet again.","chorus":""},{"id":4,"twiTitle":"YERETU SA AKO ZION","englishTitle":"WE'RE MARCHING TO ZION","twi":"Mo a modo Awurade\nMommra, mo ma mo ani ngye\nMonso mu ntonnwom a eye de\nMontwa ahennwa n'ho nhyia.\n\nWon a wonnim Nyame\nWorento nnwom yi bi\nNa osoro hene no mma no dee\nNa osoro hene no mma no dee\nWobeka won anigye akyere aman\nWobeka akyere aman.\n\nZion kokoo kronkron no\nEso nnipa mpempem\nSe yeduru so asase so\nSe yeduru soro asase so\nAnaa sikea morono no so\nSika norono no so.\n\nMomma ndwom no nko so\nNa nisuo nyinaa new\nYenam Emmanuel sase so\nYenam Emmanuel sase so\nAko bea fefe bi wo soro\nBea fefe bi wo soro.","english":"Come, we that love the Lord,\nAnd let our joys be known,\nJoin in a song with sweet accord,\nJoin in a song with sweet accord,\nAnd thus surround the throne\nAnd thus surround the throne.\n\nLet those refuse to sing\nWho never knew our God;\nBut children of the heavenly King,\nBut children of the Heavenly King,\nMay speak their joys abroad,\nMay speak their joys abroad.\n\nThe hill of Zion yields\nA thousand sacred sweets,\nBefore we reach the heavenly fields,\nBefore we reach the heav'nly fields\nOr walk the golden streets,\nOr walk the golden streets.\n\nThen let our songs abound,\nAnd ev'ry tear be dry;\nWe're marching thru Immanuel's ground,\nWe're marching thru Immanuel's ground,\nTo fairer worlds on high, to fairer worlds on high.","chorus":"Zion fefe no\nYeretu sa ado Zion\nNyame kuro fefe."},{"id":5,"twiTitle":"ODO KRONKRON","englishTitle":"LOVE DIVINE","twi":"Odo kronkron ekven 'do biara\nSoro anigye aba fam ha\nFa yen mu ye wo tenabea\nMa wo ahummobo nni mu\nYesu wo ye awerekyekye\nWo ye do a enni ano\nFa wo nkwagye no besra yen\nBewura koma biara mu.\n\nKoma biara a abre no\nHome wo do honhom gu mu\nMa yen nya adedie wo mu\nNe ahomegye a woahye ho bo n\nYi bone ho do fi yen mu\nNe yen afodi adesoa no\nWie adwuma a woahye ase no\nFa yen ko daa nkwa no mu.\n\nTumfoo Agya bra begye yen\nMa yen nsa nka wo nkwa no\nSan bra na betena yen mu\nNgya wo ntomadan yi bio\nWo na yebehyira wo daa daa\nNa yeasom wo se serspp dom no\nYe de mpaebo ne ayeyi a\nEntwa da atena wo do mu.\n\nAfei wie woabode foforo\nTe yen ho fi nkekae nyinaa ho\nMa ye nhu nkwagye kese a\nWo anya ama yen no\nSesa yen ko wo anuonyam mu\nMa soro nye ye tenabea\nMa yento yeade ngu w'anim\nWo do ne ayeyi mu.","english":"Love divine, all love excelling,\nJoy of heav'n, to earth come down\nFix in us Thy humble dwelling\nAll Thy faithful mercies crown\nJesus, Thou art all compassion,\nPure, unbounded love Thou art;\nVisit us with Thy salvation,\nEnter ev'ry trembling heart.\n\nBreath, o breathe Thy loving Spirit\nInto ev'ry troubled breast;\nMay we all in Thee inherit\nMay we find the promised rest;\nTake away the love of sinning,\nTake our load of guilt away;\nEnd the work of Thy beginning,\nBring us to eternal day.\n\nCome, almighty to deliver,\nMay we all Thy life receive;\nSuddenly return, and never,\nNever more Thy temples leave;\nThee we would be always blessing,\nServe Thee as Thy hosts above\nPray, and praise Thee, without ceasing,\nGlory in Thy perfect love.\n\nFinish then Thy new creation,\nPure, unspotted, may we be;\nMay we see our whole salvation\nPerfectly secured by Thee;\nChanged form glory into glory,\nTill in heav'n we take our place,\nTill we cast our crowns before Thee,\nLost in wonder, love and praise","chorus":""},{"id":6,"twiTitle":"BREBRE NA EYE","englishTitle":"TWI VERSION","twi":"Brèbre na eye Okristoni.\nFa ntoobase ye woade nyinaa\nNyame na ose brèbre na eye\nOkristoni ee brèbre na eye.\n\nMma wobo mfu Okristoni\nFa ntoobase ye wade nyinaa\nNyame na ose mma wobo mfu\nOkristoni ee mma wobo mfu.\n\nkae mma nsem no Okristoni\nNa bo mmoden di so daa nyinaa\nNyame na ose Okristoni ee\nSe wodo me a di me mma so.\n\ngyae kokonsa na ka nokore\nGyae nsekubo, gyae akayo\nNyame na ose gyae nkonkonsa\nOkristoni ee gyae nkonkonsa.\n\nma w'aniso na hwe soro ho\nMa kae hu se Onyame nnae\nBone a yeye ohu ne nyinaa\nOkristoni ee di asempa.\n\nenna reko enna reba\nNa kae hu se wo nna rehi\nOsoro ho wo wo adonta bi bu\nOkristoni ee obra twa wu.","english":"","chorus":""},{"id":7,"twiTitle":"MÉTIE","englishTitle":"I'LL BE LISTENING","twi":"Se Agyenkwa no fré a megye so\nSe ofré me a mète ne nne\nSe Agyenkwa no fé a megye so\nMegyina baabi na m'atie me din.\n\nSe makoma tene na ofré me\nSe makoma tene a mète ne nne\nSe makoma tene na ofré me\nMegyina baabi na matie me din.\n\nSe matade hyerén na ofré me\nSe matade hyerén a me ten e nne\nSe matade hyeré na ofré me\nMegyina baabi na matie me din.","english":"When the Savior calls I will answer,\nWhen He calls for me I will hear;\nWhen the Savior calls I will answer,\nI'll be somewhere list'ning for my name\n\nif my heart is right when He calls me,\nIf my heart is right I will hear;\nIf my heart is right when He calls me,\nI'll be somewhere list'ning for my name.\n\nif my robe is white when He calls me,\nIf my robe is white I will hear;\nIf my robe is white when He calls me,\nI'll be somewhere list'ning for my name.","chorus":"Megyina baabi matie\nMegyina baabi matie\nMegyina baabi na matie me din."},{"id":8,"twiTitle":"O KA ASEMPA NO","englishTitle":"TWI VERSION","twi":"O ka asempa no\nBaabiara nnipa te\nBaabiara nnipa ho asem\nNe ammaneewo\nMa Kristoni beara nka anigye nsem yi\nYen Wura, ye awua mu Wura.\n\nMonhwe ahene mu Hene\nAyaresa wo ne nsam\nNa ode nkwagye\nBre akra a woayera\nMa enkunim nwom no\nNgyegye ebun no mu.","english":"","chorus":"Oye Awura mu Awurade\nAsem Kronkron a ete ase\nNe din ye de kyen so\nNe pe ma nkwagye\nO ka asempa no\nBaabiara nnipa te\nYen Wua, ye ahene mu Hene."},{"id":9,"twiTitle":"WO ANIM HO","englishTitle":"FARTHER ALONG","twi":"Sohwe ne haw taa gya ye'adwenden se\nAden na ewo se eba saa mmere nyinaa\nBere a ebinom atwa yen ho ahyia\nWo ye bone nso haw nni won so.\n\nSe owu ba befa ye'adofo ko\nEgya awereho ne suro ne ye'afie mu\nNa ema ye dwene won a asi won yie ho\nSo wote bone mu mmere nyinaa.\n\nYen wura no si di nokware ko wuo mu\nYe adwuma twen nna kakra yi mu\nNa yerennu okwan mu suro no.\nse\n\nSe yehu Yesu se oba n'anuonyam\nSe ofi ne soro fie no mu ba a\nYebeyhia no wo fie hyenhyen no mu\nenkye bi yebete ne nyinaa ase.","english":"Tempted and tried we're oft made to wonder\nWhy it should be thus all the day long,\nWhile there are others living about us,\nNever molested tho in the wrong,\n\nWhen death has come and taken our loved ones,\nIt leaves our home so lonely and drear;\nThen do we wonder why others prosper,\nLiving so wicked year after year.\n\nFaithful till deathe said our loving Master,\nA few more days to labor and wait;\nToils of the road will then seem as nothing,\nAs we sweep thru the beautiful gate.\n\nWhen we see Jesus coming in glory,\nWhen He comes from His home in the sky;\nThen we shall meet Him in that bright mansion,\nWe'll understand it all by and by.","chorus":"Anim ho ye behu bribiara\nAnim ho yebete ne nyinaa ase\nMa w'anii nnye me nua, ka wo ho hye\nEnkye bi yebete ne nyinaa ase."},{"id":10,"twiTitle":"BUELAH MAN","englishTitle":"BEULAH LAND","twi":"Medu nnepa asase so\nEho ade nyinaa beye me de\nNa eho de ade nsa da\nNa mesum nyinaa betwam ako.\n\nAgyenkwa no ne me nante\nYenya ayonkofa deede ha\nOso me nsa n'odi manim\nFise ha ye soro hyee so.\n\nDuhwam bi wo mframa no mu\nEfi nnua a etease daa so\nNhwiren a won ahoofe mpa da\nNe enkwa nsuo sen daa nyinaa.\n\nNnwomto deede reba me nyen\nOsoro nnwm a eye de no\nAbofo hye ntade fitaa\nBom to nkwagye dwom deede.","english":"I'll reach the land of corn and wine,\nAnd all its riches freely mine;\nThere shines undimmed one blissful day,\nFor all my night will pass away.\n\nThe Saviour comes and walks with me,\nAnd sweet communion here have we;\nHe gently leads me by the hand,\nFor this is heaven's border land,\n\nA sweet perfume upon the breeze,\nIs borne from ever vernal tree,\nAnd flow'rs that never fading grow,\nWhere streams of life forever flow.\n\nThe zephyrs seem to float to me,\nSweet sounds of heaven's melody,\nAs angels with the white robed throng,\nJoin in the sweet redemption song.","chorus":"O Beulah man, oman fefe\nBere a megyina wo mepo so\nMahwe epo no agya ho\nBea a woasiesie adan ama me\nMehu asuogya ehyere ho\nMe soro ne me fie afeboo."},{"id":11,"twiTitle":"MONSURO KUO KETEWA","englishTitle":"FEAR NOT, LITTLE FLOCK","twi":"Monsuro kuo ketewa\nAgyenkwa no aka se\nAgya no de ahenie no bema mo\nMonnfa fam ha bone\nNsee mo ntade\nMe nwan ho beye fitaa se sukyerema.\n\nFitaa paa ara mehyeren akye adekyee\nFise Kristo ye abura a choro bone\nO oboneyefo fa wadesoa yi ma no\nNa fa wo haw nyinaa koka ne kuo no ho.\n\nOdwan a oyerawe wo bone abun mu no\nDwanhwefo no huu no de no baa efe\nNna aseda nwom gyegye mmepo no so se\nMayonkofo mahu dawn a oyerae no.\n\nTwi fa sohwe so a gyae wo hu yi\nYesu ye wo dwanhwefo, ne nsa ye ogye\nOrenyaa wo da, oye onua ne adamfo\nObedo wo agye wo wiase a enni awiee no m.","english":"Fear not, little flock,\nSays the Savior divine,\nThe Father has willed that the kingdom be thine;\nO soil not your garments\nWith sin here below,\nMy sheep and my lambs must be whiter than snow.\n\nFar whiter than snow, and as fair as the day,\nFor Christ is the fountain to wash guilt away;\nO give Him, poor sinner, that burden of thine,\nAnd enter the fold with the ninety and nine.\n\nYou sheep, that was lost in the valley of sin,\nWas found by the Shepherd, who gathered him in;\nWith songs of thanksgiving the hills did resound,\nMy friends and my neighbors, the lost sheep is found.\n\nRide over temptation and cease your alarms,\nYour Shepherd is Jesus, your refuge His arms;\nHe'll never forsake you - a Brother and Friend;\nBut love you and save you in worlds without end.","chorus":"Fitaa paa ara (Me pe saa m'aye Agyenkwa)\nFitaa paa ara (Me pe m'aye)\nFitaa paa ara (Me pe saa m'aye Agyenkwa)\nFitaa paa ara."},{"id":12,"twiTitle":"EYE SE METWERE YESU","englishTitle":"TIS SO SWEET TO TRUST IN JESUS","twi":"Eye se metwere Yesu\nNa megye N'asem no di\nNa me hwe ne bohye no kwan\nNa me hu dee Nyame se.\n\nEye se metwere Yesu\nMani da ne mogya so\nOnam gyidi so de me hye\nMogya a ete me ho nom'\n\nEye ampa se metwere Yesu\nGyae bone ne ahope\nNa megye nkwa, home, anigye\nNe asomdwoe fi Yesu ho.\n\nEye se metwere Yesu\nYesu pa, gyefo yonko\nMenim yie se woka me ho\nNa wobeka me ho daa.","english":"Tis so sweet to trust in Jesus,\nJust to take Him at His word,\nJust to rest upon His promise;\nJust to know, thus saith the Lord;\n\nO, how sweet to trust in Jesus,\nJust to trust His cleansing blood,\nJust in simple faith to plunge me\nNeath the healing cleansing flood.\n\nYes, tis sweet to trust in Jesus,\nJust from sin and self to cease;\nJust from Jesus simply taking\nLife, and rest, and joy, and peace.\n\nI'm so glad I learned to trust Thee,\nPrecious Jesus, Savior, Friend\nAnd I know that Thou art with me,\nWilt be with me to the end.","chorus":"Yesu, Yesu matwere no\nMaso n mahwe mpen pii\nYesu, Yesu a osom bo\nMa m'adom mentwere wo pii."},{"id":13,"twiTitle":"WOFATA YEN WURA","englishTitle":"WORTHY ART THOU","twi":"Kristo yen gyefo wo se ayeyi\nAnuonyam, nnidie ne tumi nso\nWo fata yen kra ntonton nyinaa ara\nWo fata yen wura, wo fata pii.\n\nMoma mo ne so ayeyi ne som mu\nAhotefo nyinaa mo nkoto no\nSoro abofo nso nsom no nkase\nWo fata yen wura, wo fata pii.\n\nYen wura ma yenfa nnwonto mra wanim\nWo honhom, nyansa ne tum'nhye yen ma\nMa yen fa anuonyam ne nnidie ma wo\nWo fata yen wura, wo fata pii.","english":"Worthy of praise is Christ our Redeemer,\nWorthy of glory, honor and pow'r\nWorthy of all our souls and adoration,\nWorthy art Thou.\n\nLift up the voice in praise and devotion,\nSaints of all earth before Him should bow;\nAngels in heaven worship Him saying,\nWorthy art Thou\n\nLord, may we come before Thee with singing,\nFilled with Thy spirit, wisdom and pow'r;\nMay we ascribe Thee glory and honor,\nWorthy art Thou.","chorus":"Wo fata ahonya, nhyira ne nnidie\nWo fata nyansa, anuonyam ne tumi\nWo fata soro ne asase so nnaase\nWo fata yen wura, wo fata pii."},{"id":14,"twiTitle":"OWURA SOMA ME","englishTitle":"LORD SEND ME","twi":"Adwuma abu dwuma wo ho ma obia\nTie mmoa sufre no gyegye baabiara\nYesu fre atwafoo mekeka me ho\nDen na me wura hwehwe\nMenie soma me.\n\nAkra a wow'amane mu no resu pii\nNa koma enni ahome no si apenee\nEwo se wonya me do ne ayamhyehye\nMaye ahoboa me wura me nie soma me.\n\nAkra a ekom de won su hwehwe aduane\nWorepre pe nkwa abodoo no adi\nSo ekom nne won bere a aduane abu yi\nMa me nni nokore, me nie soma me.\n\nAkra bi rekyinkyin reko mmusuo mu\nMe wura ens se megyae ma won ko wu\nMa me nkose won se mundane, ndwane\nMe wura megye won nkwa, me nie soma me.","english":"There is much to do, there's work on every hand,\nHark! The cry for help comes ringing thru the land\nJesus calls for reapers, I must active be,\nWhat wilt Thou, O master?\nHere am I, send me\n\nThere's the plaintive cry of mourning souls distressed,\nAnd the sigh of hearts who seek but find no rest;\nThese should have my love and tender sympathy,\nReady at Thy bidding, here am I, send me.\n\nThere are hung'ring souls, who cry aloud for bread,\nWith the bread of life they're longing to be fed;\nShall they starve and famish while a feast is free?\nI must be more faithful, here am I, send me.\n\nThere are souls, who linger on the brink of woe,\nLord, I must not, cannot bear to let them go;\nLet me go and tell them, brother, turn and flee;\nMaster, O would save them, here am I, send me.","chorus":"Me wo ha soma me\nMe wura me wo ha soma me\nMaye ahoboa me wura soma me"},{"id":15,"twiTitle":"AWURADE ADIDI","englishTitle":"TWI VERSION","twi":"Se w'ahotefo de anigye\nBa wo pono ho a Awurade hyirafo\nSe w'erebehyia adidi\nDe akae wo wuo nwannwa no a\nWoka won ho de anigye a\nEsen fam ha de hyira won.\n\nYede 'do koma ne ayeyi ndwom\nApue wasoree fie ha seisei\nyəani gye se yən nkwa nna nyinaa\nwo nti yəkə ahumməbə adwa anim\nna yə'Agya anim hə\nyə nya anigye wə akoma ne adwene mu.\n\nNyame adwamaa ədə adidi yi\n'Yəkofa wə wo honam ne mogyam\nTwam adidi a ekərən se\nwə dii aduan nwonwon no ntɛm so\nwo mogya ayi ne nyinaa afi hə.\n\nYə bubu abodoo a ɛkasa kyerɛ yɛn\nAbodoo kronkron a\nWode ma se ɛnyɛn yɛn kra\nNa yɛnyɛ Agyenkwa wo de ampa\nWo ne yɛn nkwa, ɛsoro abodoo\nNkwa a efi Agya no bom.\n\nKuruwa a yehira no! yənkofa dəədə\nwə deə ɔde ne mogya horo yən ho no m’\nna wama yən afata n’anim\nse yətwam kə asuo n’akyi hə a\nYɛn wura yɛda wase dɔn fɛfɛ yi a\nɛkyerə wo nkwagye tumi nyinaa.","english":"","chorus":""}];const $= view='all',query='',current=null,lang='twi',fontSize=19;function getFav(){try{return JSON.parse(localStorage.getItem('coc-twi-favorites')||'[]')}catch(e){return []}}function setFav(a){try{localStorage.setItem('coc-twi-favorites',JSON.stringify(a))}catch(e){}}function allText(h){return [h.id,h.twiTitle,h.englishTitle,h.twi,h.english,h.chorus].join(' ').toLowerCase()}function render(){let fav=getFav();let filtered=hymns.filter(h=>(view!=='favorites'||fav.includes(h.id))&&allText(h).includes(query.toLowerCase()));$('list').innerHTML='';filtered.forEach(h=>{let b=document.createElement('button');b.className='hymn';b.type='button';let n=document.createElement('span');n.className='num';n.textContent=h.id;let t=document.createElement('span');t.className='hymntext';let title=document.createElement('span');title.className='hymntitle';title.textContent=h.twiTitle;let sub=document.createElement('div');sub.className='hint';sub.textContent=h.englishTitle+' · Hymn '+h.id;t.append(title,sub);let heart=document.createElement('span');heart.className='heart';heart.textContent=fav.includes(h.id)?'♥':'♡';b.append(n,t,heart);b.addEventListener('click',()=>openHymn(h.id));$('list').append(b)});$('status').textContent=filtered.length+' hymn'+(filtered.length===1?'':'s')+' shown · '+hymns.length+' available';$('empty').classList.toggle('hidden',filtered.length>0);$('list').classList.toggle('hidden',!!current)}function openHymn(id){current=hymns.find(h=>h.id===id);if(!current)return;lang='twi';document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));$('detailTitle').textContent=current.twiTitle;$('detailMeta').textContent='Hymn '+current.id+' · '+current.englishTitle;showLyrics();updateHeart();$('detail').classList.remove('hidden');$('list').classList.add('hidden');$('empty').classList.add('hidden');$('status').classList.add('hidden')}function showLyrics(){if(!current)return;$('lyrics').textContent=current[lang];$('lyrics').style.fontSize=fontSize+'px';$('chorusWrap').classList.toggle('hidden',lang!=='twi'||!current.chorus);$('chorus').textContent=current.chorus||'';$('chorus').style.fontSize=fontSize+'px'}function updateHeart(){let yes=getFav().includes(current.id);$('detailHeart').textContent=yes?'♥ Saved':'♡ Favorite'}function back(){current=null;$('detail').classList.add('hidden');$('status').classList.remove('hidden');render()}$('searchForm').addEventListener('submit',e=>{e.preventDefault();query=$('search').value.trim();back()});$('search').addEventListener('input',()=>{query=$('search').value.trim();render()});document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));back()}));document.querySelectorAll('.lang').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;document.querySelectorAll('.lang').forEach(x=>x.classList.toggle('active',x===b));showLyrics()}));$('back').addEventListener('click',back);$('detailHeart').addEventListener('click',()=>{let f=getFav(),i=f.indexOf(current.id);if(i>=0)f.splice(i,1);else f.push(current.id);setFav(f);updateHeart();render()});$('larger').addEventListener('click',()=>{fontSize=Math.min(34,fontSize+2);showLyrics()});$('smaller').addEventListener('click',()=>{fontSize=Math.max(14,fontSize-2);showLyrics()});$('share').addEventListener('click',async()=>{let text='Hymn '+current.id+': '+(lang==='twi'?current.twiTitle:current.englishTitle)+'\n\n'+current[lang]+(lang==='twi'&&current.chorus?'\n\nNnyesoɔ:\n'+current.chorus:'');try{if(navigator.share)await navigator.share({title:current.twiTitle,text});else if(navigator.clipboard){await navigator.clipboard.writeText(text);alert('Hymn text copied.')}else alert(text)}catch(e){}});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});render();</script></body></html>
